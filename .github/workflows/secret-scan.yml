name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  crenox-scan:
    name: Crenox Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run secret detection; generate SARIF report for GitHub Code Scanning
      - name: Scan repository for secrets
        id: crenox
        uses: crenoxhq/crenox@v2.1.10
        continue-on-error: true
        with:
          args: "-r ."
          sarif: "true"

      # Upload SARIF findings to GitHub Security dashboard before evaluating exit code
      - name: Upload SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: crenox-results.sarif

      # Block PR merge if hardcoded secrets or sensitive credentials were detected
      - name: Enforce build failure on detected secrets
        if: steps.crenox.outcome == 'failure'
        run: |
          echo "::error::Crenox detected hardcoded credentials in this pull request. Build blocked."
          exit 1
